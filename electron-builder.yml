# Đóng gói installer Windows (NSIS) – chạy: npm run dist
appId: vn.folklorehorror.studio
productName: Folklore Horror Studio
copyright: Folklore Horror Studio
directories:
  output: dist
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
  - "!**/*.map"
# Bundle Remotion dựng sẵn nằm ngoài asar (Chrome headless đọc file trực tiếp)
extraResources:
  - from: out/remotion-bundle
    to: remotion-bundle
asar: true
# Binary / module native không chạy được từ trong asar ⇒ giải nén ra app.asar.unpacked
asarUnpack:
  - "**/node_modules/ffmpeg-static/**"
  - "**/node_modules/ffprobe-static/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/onnxruntime-node/**"
  - "**/node_modules/@remotion/compositor-*/**"
# Module native dùng N-API bản dựng sẵn ⇒ không cần build lại cho Electron
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Folklore Horror Studio
  artifactName: Folklore-Horror-Studio-Setup-${version}.${ext}
  # Gỡ cài đặt KHÔNG xoá dữ liệu người dùng (Story, cài đặt, API key)
  deleteAppDataOnUninstall: false
